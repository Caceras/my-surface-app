name: Apply cohesive shell
on:
  push:
    branches: [cohesive-swipe-shell]
    paths: [.github/workflows/apply-cohesive.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        run: |
          patch -p1 < .cohesive.patch
          rm -f .cohesive.patch .github/workflows/apply-cohesive.yml .github/workflows/workspace-snapshot.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/check.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify workspace navigation, context and visual identity"
          git push origin HEAD:cohesive-swipe-shell
