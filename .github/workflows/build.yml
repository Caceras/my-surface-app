name: Build Ægentica AI APKs

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# One cancellation policy for the whole candidate. A newer commit replaces every
# queued/running job for the same PR/branch instead of leaving stale jobs behind.
concurrency:
  group: aegentica-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    outputs:
      android: ${{ steps.scope.outputs.android }}
    name: Static pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python -m pip install pyyaml
      - run: python tools/check.py
      - name: Choose validation scope
        id: scope
        run: python tools/ci_scope.py

  pr-android:
    name: Fast Android validation
    needs: verify
    if: github.event_name == 'pull_request' && needs.verify.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - name: Ensure pinned Android SDK
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.7.1"
          cache-read-only: true
      - name: Test core logic and compile installable Nano APK
        run: gradle testCoreDebugUnitTest assembleNanoDebug -PbuildNumber=${{ github.run_number }} --no-daemon
      - name: Keep diagnostics on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-fast-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: warn

  release-android:
    name: Release Android validation
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.verify.outputs.android == 'true'
    # Optional trusted self-hosted runner: set repository variable ANDROID_RUNNER
    # to its label. PR code never runs there.
    runs-on: ${{ (github.event_name == 'push' && vars.ANDROID_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - name: Ensure pinned Android SDK
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.7.1"
          cache-read-only: false
      - name: Restore private preview key
        env:
          SURFACE_KEYSTORE_BASE64: ${{ secrets.SURFACE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SURFACE_KEYSTORE_BASE64" ]; then
            umask 077
            key_path="$RUNNER_TEMP/aegentica-personal.jks"
            printf '%s' "$SURFACE_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            echo "SURFACE_KEYSTORE_FILE=$key_path" >> "$GITHUB_ENV"
          fi
      - name: Full release gate
        env:
          SURFACE_KEYSTORE_PASSWORD: ${{ secrets.SURFACE_KEYSTORE_PASSWORD }}
          SURFACE_KEY_ALIAS: ${{ secrets.SURFACE_KEY_ALIAS }}
          SURFACE_KEY_PASSWORD: ${{ secrets.SURFACE_KEY_PASSWORD }}
        run: gradle testCoreDebugUnitTest lintCoreDebug lintNanoDebug assembleCoreDebug assembleNanoDebug -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace
      - name: Verify APK signatures
        run: |
          for flavor in core nano; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk" > "app/build/reports/apk-signature-$flavor.txt"
          done
      - name: Collect verified release evidence
        run: python tools/release_evidence.py collect dist/evidence
      - name: Keep diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/screenshots/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload verified build bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aegentica-evidence
          path: dist/evidence/
          retention-days: 30
          if-no-files-found: error
          compression-level: 1
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aegentica-personal.jks"

  preview:
    name: Publish verified preview
    needs: release-android
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: aegentica-evidence
          path: dist/evidence
      - name: Verify and publish build-specific download
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_preview.py
