name: Build debug APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static pre-flight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Two seconds here, versus three minutes to discover the same dangling
      # resource reference at the end of a Gradle build.
      - run: python tools/verify.py .
      - run: python tools/test_verify.py

  test:
    name: JVM tests
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Pinned rather than defaulted, because the default package list is
      # "tools platform-tools" and "tools" is an obsolete meta-package that
      # drags in the ~1 GB Android Emulator. Nothing here needs it: the JVM
      # tests run on Robolectric and the builds never start a device. It cost
      # a red build once already, when that download unzipped corrupt --
      # "Error on ZipFile unknown archive" -- and took the whole job with it
      # before a single test ran.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      # Robolectric renders the real activities on the JVM. Run against the
      # core flavour, whose brain is deterministic -- the nano brain would
      # need AICore, which exists on no CI runner and no emulator.
      - name: Unit tests
        run: gradle testCoreDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: app/build/reports/tests/

      # ShotTest rasterises the real screens through Robolectric's native
      # graphics mode. There is no emulator here and no Android SDK on the
      # machine these changes are written on, so this is the only way anyone
      # -- person or model -- gets to see what was actually shipped before a
      # phone does. always(), because a failed run is exactly when the
      # picture is worth having.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: warn

  build:
    name: Build ${{ matrix.flavour }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: core
            task: assembleCoreDebug
            apk: app/build/outputs/apk/core/debug/app-core-debug.apk
          - flavour: nano
            task: assembleNanoDebug
            apk: app/build/outputs/apk/nano/debug/app-nano-debug.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Pinned rather than defaulted, because the default package list is
      # "tools platform-tools" and "tools" is an obsolete meta-package that
      # drags in the ~1 GB Android Emulator. Nothing here needs it: the JVM
      # tests run on Robolectric and the builds never start a device. It cost
      # a red build once already, when that download unzipped corrupt --
      # "Error on ZipFile unknown archive" -- and took the whole job with it
      # before a single test ran.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build
        run: gradle ${{ matrix.task }} -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      # Naming the APK after the flavour stops downloads from piling up as
      # "app-debug(1).apk" in the phone's Downloads folder.
      - name: Name the APK
        run: cp "${{ matrix.apk }}" "pixel-surface-lab-${{ matrix.flavour }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-surface-lab-${{ matrix.flavour }}
          path: pixel-surface-lab-${{ matrix.flavour }}.apk

  # A branch build is only useful if you can install it. Workflow artifacts
  # are always served as a .zip and Android will not install one, so a branch
  # gets its own release too -- marked prerelease, which keeps /releases/latest
  # pointing at main so the bookmark on the phone still means "the real build".
  preview:
    name: Publish branch preview
    needs: [build, test]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Branch names carry slashes and capitals; tags are happier without.
          slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' \
                 | tr -c 'a-z0-9._-' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
          tag="preview-$slug"

          # One rolling tag per branch, so the phone can keep the same URL for
          # as long as the branch exists. --target is required because the tag
          # does not exist yet.
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            apks/*.apk \
            --title "Preview: $GITHUB_REF_NAME (build $GITHUB_RUN_NUMBER)" \
            --notes "Unmerged branch build of \`$GITHUB_REF_NAME\`. Open this page on your
          phone and tap an .apk to install.

          This is build **$GITHUB_RUN_NUMBER**; the app shows the same number behind
          **More** on its first screen, so you can tell at a glance whether the install took.

          A preview is signed with the same debug key as every other build here, so it
          upgrades over an existing install of the same flavour. It is a prerelease, so
          \`/releases/latest\` still points at the build from main."

  release:
    name: Publish rolling release
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      # A release asset is a direct .apk link, so it installs straight from the
      # phone browser. Workflow artifacts are always served as a .zip, which
      # Android will not install. This is the single most common place this
      # workflow dies.
      #
      # One rolling tag is reused so the phone can bookmark /releases/latest and
      # never need a new URL. Deleting first keeps the step idempotent.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create debug-latest \
            --repo "$GITHUB_REPOSITORY" \
            apks/*.apk \
            --title "Debug build ${{ github.run_number }}" \
            --notes "Open this page on your phone and tap an .apk to install.

          This is build **${{ github.run_number }}**. The app shows the same number on its
          first screen, so you can tell at a glance whether the install took.

          - **nano** - Gemini Nano on the device. Select text anywhere, tap Ask, and prompt it freely. Summarise, Proofread and Make professional are presets. Works with the radios off.
          - **core** - the zero-dependency template. No model, no dependencies.

          Both can be installed side by side."
