name: Build Ægentica AI APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Compilation/tests never need repository write access.
permissions:
  contents: read

jobs:
  verify:
    concurrency:
      group: preflight-${{ github.ref }}
      cancel-in-progress: true
    name: Static pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python -m pip install pyyaml
      - run: python tools/check.py

  quality:
    concurrency:
      group: quality-${{ github.ref }}
      cancel-in-progress: true
    name: Android quality
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - name: Ensure pinned Android SDK
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "9.7.1"
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Restore private preview key
        if: github.event_name != 'pull_request'
        env:
          SURFACE_KEYSTORE_BASE64: ${{ secrets.SURFACE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SURFACE_KEYSTORE_BASE64" ]; then
            umask 077
            key_path="$RUNNER_TEMP/aegentica-personal.jks"
            printf '%s' "$SURFACE_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            echo "SURFACE_KEYSTORE_FILE=$key_path" >> "$GITHUB_ENV"
          fi
      - name: Test, lint and build both variants
        env:
          SURFACE_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SURFACE_KEYSTORE_PASSWORD || '' }}
          SURFACE_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.SURFACE_KEY_ALIAS || '' }}
          SURFACE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.SURFACE_KEY_PASSWORD || '' }}
        run: gradle testCoreDebugUnitTest lintCoreDebug lintNanoDebug assembleCoreDebug assembleNanoDebug -PbuildNumber=${{ github.run_number }} --continue --no-daemon --stacktrace
      - name: Verify APK signatures
        run: |
          for flavor in core nano; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk" > "app/build/reports/apk-signature-$flavor.txt"
          done
      - name: Collect verified release evidence
        # Reads app/build/outputs/apk/ plus JUnit, lint and native render outputs.
        run: python tools/release_evidence.py collect dist/evidence
      - name: Keep test and lint diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/screenshots/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload verified build bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aegentica-evidence
          path: dist/evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aegentica-personal.jks"

  preview:
    # Finish active uploads; a newer candidate waits and rechecks branch HEAD.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    name: Publish verified preview
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: aegentica-evidence
          path: dist/evidence
      - name: Verify and publish build-specific download
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_preview.py
