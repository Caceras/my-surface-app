name: Apply reviewed offline repair
on:
  push:
    branches: [fix-reader-streaming]
    paths: [.github/workflows/source-snapshot.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix-reader-streaming'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply hash-checked edits to the repair branch only
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd().resolve()
          for entry in json.loads(Path('tools/offline-repair.json').read_text()):
              path = (root / entry['path']).resolve()
              assert path.is_relative_to(root), entry['path']
              text = path.read_text(encoding='utf-8')
              assert hashlib.sha256(text.encode()).hexdigest() == entry['before'], ('baseline', entry['path'])
              for start, end, replacement in reversed(entry['edits']):
                  text = text[:start] + replacement + text[end:]
              assert hashlib.sha256(text.encode()).hexdigest() == entry['after'], ('result', entry['path'])
              path.write_text(text, encoding='utf-8')
          Path('tools/offline-repair.json').unlink()
          Path('.github/workflows/source-snapshot.yml').unlink()
          PY
          git add -A
          test "$(git write-tree)" = "8cbbd41366f43d1c89bf412af69570518a6a2002"
      - run: python -m pip install pyyaml
      - run: python tools/check.py
      - name: Commit the verified source tree without publishing an APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix reader voices, Markdown, streaming and excessive UI copy'
          git push origin HEAD:fix-reader-streaming
