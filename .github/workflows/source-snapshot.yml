name: Source snapshot for offline review
on:
  push:
    branches: [fix-reader-streaming]
    paths: [.github/workflows/source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tracked-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 1
          if-no-files-found: error
