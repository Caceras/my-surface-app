name: LiveKit agent tests

on:
  push:
    branches: ["main"]
    paths: ["agent/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/agent.yml"]

# Tests never need repository write access.
permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned dependencies
        working-directory: agent
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-test.txt
      - name: Run agent tests
        working-directory: agent
        run: .venv/bin/python -m pytest -q
      # The server builds this image; build it here too so a broken build step
      # fails the pull request instead of the deploy.
      - name: Build the agent image
        run: docker build --quiet --tag aegentica-voice-agent:ci agent
