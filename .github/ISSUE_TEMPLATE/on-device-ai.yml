name: On-device AI problem
description: Gemini Nano readiness, response quality or cancellation
labels: ["ai"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [AI guide](https://github.com/Caceras/my-surface-app/blob/improve-pixel-assistant/docs/ai.md).
        Model readiness, recognition packs and TTS voices are separate. Language quality depends on the API/model and device; do not infer it from a speech-pack download.
        Remove private content before reporting a prompt or response.
  - type: input
    id: build
    attributes:
      label: Installed build from Settings
      placeholder: "3.0.102-nano"
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: Exact status or error
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone, Android and AICore version
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: Task
      options: ["Chat / follow-up", "Voice conversation", "Summarise", "Proofread", "Make professional", "Model setup", "Multiple tasks"]
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Prompt language and selected speech language
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual result
      description: Include a short non-private prompt if needed to reproduce.
    validations:
      required: true
