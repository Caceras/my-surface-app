name: Build failure
description: The build fails locally or in CI
labels: ["build"]
body:
  - type: markdown
    attributes:
      value: |
        Please check
        [the version guide](https://github.com/Caceras/my-surface-app/blob/improve-pixel-assistant/docs/versions.md) first — it maps the
        common error strings to the fix.
  - type: input
    id: error
    attributes:
      label: The exact error line
      placeholder: "Minimum supported Gradle version is 9.5.0."
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `gradle --version` and `java -version`
      render: shell
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: ["Local", "GitHub Actions", "Both"]
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: "I ran `python tools/check.py` and included its first failure, if any."
  - type: input
    id: run
    attributes:
      label: CI run URL and source SHA
      description: For Actions failures, include the run and failing step. The android-diagnostics artifact retains reports.
